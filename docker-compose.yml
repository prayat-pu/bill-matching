services:
  bill-matching:
    build: .
    image: bill-matching:latest
    # GEMINI_API_KEY (and optionally GEMINI_MODEL) are read from .env at the
    # repo root. The key stays in the container; the browser never sees it.
    env_file: .env
    environment:
      PORT: 40000
      HOST: 0.0.0.0
      LOG_LEVEL: info
    ports:
      - "40000:40000"
    restart: unless-stopped
    # Rendering a PDF page writes to a temp dir, nothing else is written.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
